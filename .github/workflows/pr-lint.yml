name: Lint

on:
  pull_request:
  push:
    branches: [master, main]

env:
  FLUTTER_VERSION: 3.38.10

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev

      - name: Dummy Envs
        run: |
          envsubst < .env.example > .env
        env:
          ENABLE_UPDATE_CHECK: true
          LASTFM_API_KEY: xxx
          LASTFM_API_SECRET: xxx
          RELEASE_CHANNEL: nightly
          HIDE_DONATIONS: 0

      - name: Configure repo
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Lint Dart files
        # themes/ is a nested Dart package with its own pubspec and CI; the
        # root analyzer must not try to resolve it under the app package.
        run: |
          dart analyze --no-fatal-warnings lib test packages

      - name: Verify generated l10n is current
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n/generated untranslated_messages.json

      - name: Verify drift migrations are current
        run: |
          dart run drift_dev make-migrations
          git diff --exit-code -- drift_schemas lib/models/database

      # The rest of test/ is local-only; these are the hermetic tests a clean
      # clone actually has. Keep the list in test/ci_suite.txt.
      - name: Check the published test subset is formatted
        run: |
          dart format --output=none --set-exit-if-changed \
            $(grep -v '^#' test/ci_suite.txt)

      - name: Host regression subset
        run: |
          flutter test $(grep -v '^#' test/ci_suite.txt)
