name: Lint

on:
  pull_request:

env:
  FLUTTER_VERSION: 3.35.2

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Dummy Envs
        run: |
          envsubst < .env.example > .env
        env:
          ENABLE_UPDATE_CHECK: true
          LASTFM_API_KEY: xxx
          LASTFM_API_SECRET: xxx
          RELEASE_CHANNEL: nightly
          HIDE_DONATIONS: 0

      - name: Configure repo
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Lint Dart files
        run: |
          dart analyze --no-fatal-warnings

      - name: Lint tests strictly
        run: |
          dart analyze --fatal-warnings test

      - name: Verify generated l10n is current
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n/generated untranslated_messages.json

      - name: Verify drift migrations are current
        run: |
          dart run drift_dev make-migrations
          git diff --exit-code -- drift_schemas lib/models/database test/drift

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Dummy Envs
        run: |
          envsubst < .env.example > .env
        env:
          ENABLE_UPDATE_CHECK: true
          LASTFM_API_KEY: xxx
          LASTFM_API_SECRET: xxx
          RELEASE_CHANNEL: nightly
          HIDE_DONATIONS: 0

      - name: Configure repo
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Run tests
        run: |
          flutter test --coverage
