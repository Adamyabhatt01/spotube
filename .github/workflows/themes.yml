name: themes

on:
  push:
    branches: [master, main]
    paths:
      - 'themes/**'
      - '.github/workflows/themes.yml'
  pull_request:
    paths:
      - 'themes/**'
      - '.github/workflows/themes.yml'
  workflow_dispatch:

# The theme toolchain is a plain Dart package with its own pubspec, so every
# step runs inside it.
defaults:
  run:
    working-directory: themes

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.10.x

      - name: install
        run: dart pub get

      - name: analyze
        run: dart analyze

      - name: the contract's tests
        run: dart test

      - name: build every theme
        run: dart run tools/build.dart

      # The compiler timestamp is pinned, so a rebuild has to produce the same
      # archive bytes. The golden payloads below are the contract check; this
      # is the reproducibility check.
      - name: builds are reproducible
        run: |
          find dist -name '*.smplug' -print0 | sort -z | xargs -0 sha256sum > /tmp/themes.sha256
          dart run tools/build.dart
          sha256sum -c /tmp/themes.sha256

      - name: the golden payloads are up to date
        run: |
          dart run tools/export.dart
          git diff --exit-code -- conformance

      - name: the built themes still match their goldens
        run: dart test
