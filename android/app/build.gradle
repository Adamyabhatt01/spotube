plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "org.jetbrains.kotlin.plugin.compose"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def composeVersion = "1.4.8"

android {
    namespace "oss.krtirtho.spotube"
    
    compileSdkVersion 36

    ndkVersion = "29.0.14206865"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    buildFeatures {
        compose true
    }

    // The app's memory-backing policy (see cpp/memory_backing.cpp): a
    // per-process prctl(PR_SET_THP_DISABLE) so the kernel does not back the
    // Dart VM's sparsely-touched heap arena with 2 MB huge pages.
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    composeOptions {
        kotlinCompilerExtensionVersion "$composeVersion" // Correlates with org.jetbrains.kotlin.android plugin in settings.gradle
    }

    defaultConfig {
        applicationId "oss.krtirtho.spotube"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true

        // Ships the memory-backing helper (libspotube.so) that
        // MemoryBacking.kt loads.
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
                cppFlags "-std=c++14"
            }
        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            // R8 + resource shrink. Keeps live in proguard-rules.pro
            // (Flutter, Glance/Compose, kotlinx.serialization,
            // NewPipeExtractor + Rhino). Verify on CI: release APK must
            // boot, play a track, and render the Glance widget.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    flavorDimensions "default"

    productFlavors {
        nightly {
            dimension "default"
            resValue "string", "app_name_en", "Spotube Nightly"
            applicationIdSuffix ".nightly"
            versionNameSuffix "-nightly"
            signingConfig signingConfigs.release
        }
        dev {
            dimension "default"
            resValue "string", "app_name_en", "Spotube Dev"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            signingConfig signingConfigs.release
        }
        stable {
            dimension "default"
            resValue "string", "app_name_en", "Spotube"
            signingConfig signingConfigs.release
        }
    }

    packagingOptions {
        resources.excludes += "DebugProbesKt.bin"
    }
}

flutter {
    source '../..'
}

def glanceVersion = "1.1.1"
dependencies {
    // Must stay the plain artifact: desugar_jdk_libs_nio would backport
    // java.net.URLEncoder.encode(String, Charset) (API 33), which
    // NewPipeExtractor's utils call undixed today, but it cannot be dexed by
    // AGP 8.7 at all — per-module DexingNoClasspathTransform has no
    // android.jar root, so R8 fails with "android.jar is located outside the
    // root directory". flutter_new_pipe_extractor pins this same artifact.
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    // Flutter's own FlutterMultiDexApplication imports androidx.multidex, so
    // the legacy coordinate was only usable through jetifier rewriting.
    implementation 'androidx.multidex:multidex:2.0.1'

    implementation "androidx.glance:glance-appwidget:$glanceVersion"
    implementation "androidx.glance:glance-appwidget-preview:$glanceVersion"
    implementation "androidx.glance:glance-preview:$glanceVersion"
    implementation "androidx.glance:glance-material3:$glanceVersion"
    implementation "androidx.glance:glance-material:$glanceVersion"
    implementation "androidx.work:work-runtime-ktx:2.8.1"

    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3"
    implementation 'com.google.code.gson:gson:2.11.0'
}