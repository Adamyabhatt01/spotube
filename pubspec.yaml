name: spotube
description: Open source extensible music streaming platform and app, based on BYOMM (Bring your own music metadata) concept

publish_to: "none"

version: 5.1.2+45

homepage: https://spotube.krtirtho.dev
repository: https://github.com/KRTirtho/spotube

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
