  skeletonizer: ^2.1.0+1
  sliding_up_panel: ^2.0.0+1
  sliver_tools: ^0.2.12
  smtc_windows: ^1.1.0
  sqlite3: ^2.4.3
  sqlite3_flutter_libs: ^0.5.23
  timezone: ^0.10.0
  titlebar_buttons: ^1.0.0
  tray_manager: ^0.5.0
  url_launcher: ^6.2.6
  uuid: ^4.4.0
  version: ^3.0.2
  very_good_infinite_list: ^0.9.0
  visibility_detector: ^0.4.0+2
  web_socket_channel: ^3.0.1
  wikipedia_api: ^0.1.0
  win32_registry: ^1.1.5
  window_manager: ^0.4.3
  youtube_explode_dart: ^3.1.0
  yt_dlp_dart:
    git:
      url: https://github.com/KRTirtho/yt_dlp_dart.git
      ref: 4e5310e14af74bdbb51e2a4766e66d6c6a2562a8
  flutter_new_pipe_extractor:
    git:
      # DEP.4: pinned to the tested resolution (was floating HEAD).
      ref: 41cbd821ce49b9343136f67d83d3117e582dad75
      url: https://github.com/KRTirtho/flutter_new_pipe_extractor
  http_parser: ^4.1.2
  # DEP.3: exact pin of the tested resolution (was `any` appeasement for the
  # SDK/transitive collection conflict; moved here from direct ^1.18.0 in the
  # Flutter 3.29 upgrade). Do not widen without a trial resolve.
  collection: 1.19.1
  archive: ^4.0.7
  hetu_script: ^0.4.2+1
  hetu_std:
    git:
      url: https://github.com/hetu-community/hetu_std.git
      # DEP.4: pinned to the tested resolution (was branch main).
      ref: 401fde426339cf8f1e00dee22cc95f64c3e60053
  hetu_otp_util:
    git:
      url: https://github.com/hetu-community/hetu_otp_util.git
      # DEP.4: pinned to the tested resolution (was branch main).
      ref: 7790606751828758769596e809ba6cbb756f9b9a
  hetu_spotube_plugin:
    git:
      url: https://github.com/KRTirtho/hetu_spotube_plugin.git
      # DEP.4: pinned to the tested resolution (was branch main).
      ref: d85dd429241d464a8b5b0c2b3d870143eeba8b46
  get_it: ^8.0.3
  flutter_markdown_plus: ^1.0.3
  pub_semver: ^2.2.0
  change_case: ^1.1.0
  flutter_secure_storage: ^9.2.4
  # Have to use the git version due to unresponsive .move() after .add()
  # DEP.2: pinned to the tested commit. The default branch has moved on;
  # floating here would resolve different playback code on clean machines.
  media_kit:
    git:
      url: https://github.com/media-kit/media-kit
      ref: d310049f24196250d876efb02b9ff56fa9ef5068
      path: media_kit
  media_kit_libs_audio:
    git:
      url: https://github.com/media-kit/media-kit
      ref: d310049f24196250d876efb02b9ff56fa9ef5068
      path: libs/universal/media_kit_libs_audio
  base32: ^2.2.0

dev_dependencies:
  build_runner: ^2.4.13
  # ISSUE.8: direct declaration for cli/commands/build/windows.dart (sha256
  # of the built exe). Previously transitive-only at the same version.
  crypto: ^3.0.7
  envied_generator: ^1.0.0
  flutter_gen_runner: ^5.4.0
  flutter_launcher_icons: ^0.14.2
  flutter_lints: ^3.0.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  json_serializable: ^6.6.2
  freezed: ^2.5.2
  process_run: ^0.14.2
  pubspec_parse: ^1.3.0
  pub_api_client: ^3.0.0
  io: ^1.0.4
  drift_dev: ^2.21.0
  test: any
  # Hermetic time-based tests (debounce/timeout/wave assertions).
  fake_async: ^1.3.3
  auto_route_generator: ^9.0.0

dependency_overrides:
  bonsoir_android:
    git:
      url: https://github.com/KRTirtho/Bonsoir.git
      # DEP.4: pinned to the tested resolution (was floating HEAD).
      ref: aa5604628ba41e3a7153769f4465a3d375488f2e
      path: packages/bonsoir_android
  # DEP.4: force the pinned SHAs transitively too. hetu_spotube_plugin
  # itself depends on hetu_std/hetu_otp_util at branch main,
  # desktop_webview_window at HEAD and fk_user_agent at HEAD, which would
  # otherwise conflict with (and float past) the direct pins above.
  hetu_std:
    git:
      url: https://github.com/hetu-community/hetu_std.git
      ref: 401fde426339cf8f1e00dee22cc95f64c3e60053
  hetu_otp_util:
    git:
      url: https://github.com/hetu-community/hetu_otp_util.git
      ref: 7790606751828758769596e809ba6cbb756f9b9a
  desktop_webview_window:
    git:
      url: https://github.com/KRTirtho/flutter-plugins.git
      ref: f261ff20e310d05713249b21c199a9fe17a3de6f
      path: packages/desktop_webview_window
  fk_user_agent:
    git:
      url: https://github.com/maeltoukap/fk_user_agent.git
      ref: 458046cd9a88924e5074d96ba45397219d53b230
  meta: 1.16.0
  web: ^1.1.0
  flutter_svg: ^2.0.17
  # DEP.3: mirror the direct pins above so overrides cannot float past them.
  intl: 0.20.2
  collection: 1.19.1
  flutter_secure_storage_platform_interface: 2.0.0
  flutter_secure_storage_linux:
    git:
      url: https://github.com/m-berto/flutter_secure_storage.git
      ref: patch-2
      path: flutter_secure_storage_linux
  # DEP.2: platform libs must track the same tested media-kit commit as the
  # main dependency above — never float these independently.
  media_kit_libs_android_audio:
    git:
      url: https://github.com/media-kit/media-kit
      ref: d310049f24196250d876efb02b9ff56fa9ef5068
      path: libs/android/media_kit_libs_android_audio
  media_kit_libs_ios_audio:
    git:
      url: https://github.com/media-kit/media-kit
      ref: d310049f24196250d876efb02b9ff56fa9ef5068
      path: libs/ios/media_kit_libs_ios_audio
  media_kit_libs_macos_audio:
    git:
      url: https://github.com/media-kit/media-kit
      ref: d310049f24196250d876efb02b9ff56fa9ef5068
      path: libs/macos/media_kit_libs_macos_audio
  media_kit_libs_windows_audio:
    git:
      url: https://github.com/media-kit/media-kit
      ref: d310049f24196250d876efb02b9ff56fa9ef5068
      path: libs/windows/media_kit_libs_windows_audio
  media_kit_libs_linux:
    git:
      url: https://github.com/media-kit/media-kit
      ref: d310049f24196250d876efb02b9ff56fa9ef5068
      path: libs/linux/media_kit_libs_linux

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/logos/
    - assets/branding/spotube-logo.png
    - assets/branding/spotube-logo-light.png
    - assets/branding/spotube-logo.ico
    - assets/plugins/spotube-plugin-musicbrainz-listenbrainz/plugin.smplug
    - assets/plugins/spotube-plugin-youtube-audio/plugin.smplug
    - LICENSE
    - packages/flutter_undraw/assets/undraw/access_denied.svg
    - packages/flutter_undraw/assets/undraw/fixing_bugs.svg
    - packages/flutter_undraw/assets/undraw/secure_login.svg
    - packages/flutter_undraw/assets/undraw/explore.svg
    - packages/flutter_undraw/assets/undraw/dreamer.svg
    - packages/flutter_undraw/assets/undraw/happy_music.svg
    - packages/flutter_undraw/assets/undraw/follow_me_drone.svg
    - packages/flutter_undraw/assets/undraw/taken.svg
    - packages/flutter_undraw/assets/undraw/empty.svg
    - packages/flutter_undraw/assets/undraw/no_data.svg
    - packages/flutter_undraw/assets/undraw/process.svg
    - packages/flutter_undraw/assets/undraw/stars.svg
    # hetu script bytecode
    - packages/hetu_std/assets/bytecode/std.out
    - packages/hetu_otp_util/assets/bytecode/otp_util.out
    - packages/hetu_spotube_plugin/assets/bytecode/spotube_plugin.out
    # NewPipe binaries (desktop only)
    # - packages/flutter_new_pipe_extractor/assets/
  fonts:
    - family: RadixIcons
      fonts:
        - asset: packages/shadcn_flutter/icons/RadixIcons.otf
    - family: BootstrapIcons
      fonts:
        - asset: packages/shadcn_flutter/icons/BootstrapIcons.otf
    - family: Cookie
      fonts:
        - asset: assets/fonts/Cookie-Regular.ttf
          style: normal
          weight: 500
    - family: Ubuntu Mono
      fonts:
        - asset: assets/fonts/Ubuntu_Mono/UbuntuMono-Regular.ttf
          style: normal
          weight: 400
        - asset: assets/fonts/Ubuntu_Mono/UbuntuMono-Bold.ttf
          style: normal
          weight: 700
        - asset: assets/fonts/Ubuntu_Mono/UbuntuMono-Italic.ttf
          style: italic
          weight: 400
        - asset: assets/fonts/Ubuntu_Mono/UbuntuMono-BoldItalic.ttf
          style: italic
          weight: 700

flutter_gen:
  output: lib/collections

flutter_native_splash:
  background_image: assets/bengali-patterns-bg.jpg
  image: assets/spotube-logo.png
  branding: assets/branding.png
  android_12:
    image: assets/spotube-logo_android12.png
    branding: assets/branding.png
    color: "#000000"
    icon_background_color: "#000000"
