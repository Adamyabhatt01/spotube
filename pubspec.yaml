  flutter_native_splash: ^2.4.6
  flutter_riverpod: ^2.5.1
  flutter_sharing_intent: ^1.1.0
  flutter_undraw: ^0.2.1
  form_builder_validators: ^11.1.1
  freezed_annotation: ^2.4.1
  fuzzywuzzy: ^1.1.6
  home_widget: ^0.7.0
  hooks_riverpod: ^2.5.1
  html: ^0.15.1
  html_unescape: ^2.0.0
  http: ^1.2.1
  image_picker: ^1.1.0
  # DEP.3: exact pin of the tested resolution (was `any` appeasement for the
  # flutter_localizations/plugin-graph conflict). Do not widen without a
  # trial resolve proving the conflict is gone.
  intl: 0.20.2
  local_notifier: ^0.1.6
  logger: ^2.8.0
  logging: ^1.3.0
  lrc: ^1.0.2
  metadata_god: ^1.1.0
  mime: ^2.1.0
  open_file: ^3.5.10
  package_info_plus: ^6.0.0
