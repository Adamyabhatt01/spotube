[package]
name = "yt-extract"
version = "0.1.0"
edition = "2024"
# Edition 2024 itself needs 1.85; let-chains in this crate need 1.88.
rust-version = "1.88"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time"] }

# Embedding target: small, fast static binary.
[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
